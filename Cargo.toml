[package]
name = "netscan"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dioxus = { version = "0.7.10", features = ["desktop"] }
dns-lookup = "4.0.2"
futures = "0.3.34"
mdns-sd = "0.21.6"
netdev = "0.47.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
surge-ping = "0.9.1"
tokio = { version = "1.54.1", features = ["full"] }
pty-process = { version = "0.5.4", features = ["async"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"
